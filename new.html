        animation-iteration-count: infinite;

        display: none;
        background-color: aquamarine;
    }

    #clo {
        background-color: brown;
        display: none;
        cursor: pointer;
    }

    #cist:hover .sites {
        display: block;

    }

    @keyframes sit {
        0% {
            background-color: aqua;
        }

        25% {
            background-color: rgb(15, 240, 240);
        }

        50% {
            background-color: rgb(10, 226, 226);
        }

        75% {
            background-color: rgb(13, 211, 211);
        }

        100% {
            background-color: rgb(17, 197, 197);
