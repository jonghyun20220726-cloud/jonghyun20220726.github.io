    @keyframes sit {

    @keyframes running {
        0% {

        }

        25% {
            background-color: rgb(103, 149, 235);
        }

        50% {

        }

        75% {
            background-color: rgb(109, 148, 221);
        }

        100% {
            background-color: rgb(129, 156, 207);
        }
    }
</style>
